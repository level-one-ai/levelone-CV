<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<title>{{full_name}} — CV</title>
<style>
  /* ==================================================================
     Level One CV — A4, print-first.

     This file is the DEFAULT template. On first run it is copied into
     the `cv_template` collection in PocketBase, and after that the
     PocketBase copy is what gets used — edit it there.

     ------------------------------------------------------------------
     EVERY PLACEHOLDER, AND WHETHER THE AI TOUCHES IT
     ------------------------------------------------------------------

     TAILORED — rewritten for every job advert you paste in:

       {{headline}}           job title under your name
       {{summary}}            the PROFILE paragraph
       {{tools_html}}         TOOLS, re-ordered so the advert's own
                              tools come first
       {{experience_html}}    your jobs, bullets rewritten
       {{projects_html}}      your projects, re-ordered and re-described

     FIXED — printed exactly as you typed it in PocketBase, every time:

       {{full_name}}          your full name
       {{first_name}}         first name (for the stacked heading)
       {{last_name}}          surname
       {{photo_html}}         your headshot
       {{contact_html}}       phone, address, email, links
       {{skills_html}}        SKILLS — the human ones
       {{education_html}}     schools, qualifications, grades

     ALSO AVAILABLE — not used in this layout, but they work if you
     want them:

       {{job_title}}          the advert's job title
       {{company}}            the hiring company
       {{email}} {{phone}} {{location}}

     Two kinds of placeholder:
       {{scalar}}       one value, e.g. {{full_name}}
       {{name_html}}    a block the app builds. Move it wherever you
                        like, but do not try to write inside it.

     A placeholder the app does not recognise is replaced with nothing,
     so a typo leaves a gap rather than printing {{braces}} on your CV.

     Colours are the Level One palette, same as the web app.
     ================================================================== */

  @page {
    size: A4;
    margin: 0;
  }

  :root {
    --ink: #111110;        /* sidebar + headings */
    --page: #faf9f6;       /* warm off-white page */
    --muted: #6b6a66;      /* secondary text */
    --line: #e8e6e0;       /* hairline rules */
    --on-dark: #f3f1ea;    /* text on the dark sidebar */
    --on-dark-muted: #a7a49b;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
  }

  /* The dark column is painted by the BODY background, not by the sidebar
     element. A body background propagates to the page box, so Chromium
     repaints it on every printed sheet — which means the dark stripe runs
     the full length of a CV however many pages it takes.

     The obvious alternative, a `position: fixed` sidebar, looks right on
     page one and then silently clips: anything past 297mm is simply cut
     off, so a long education list disappears. This way the sidebar is an
     ordinary column that grows and flows across pages. */
  body {
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 9.6pt;
    line-height: 1.5;
    background: linear-gradient(
      to right,
      var(--ink) 0 68mm,
      var(--page) 68mm 100%
    );
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .sheet {
    display: flex;
    align-items: flex-start;
    width: 210mm;
    min-height: 297mm;
  }

  /* ---------------------------- sidebar ---------------------------- */

  .sidebar {
    width: 68mm;
    flex-shrink: 0;
    /* Transparent: the dark comes from the body background above. */
    color: var(--on-dark);
  }

  /* Keep a heading and its list on the same sheet. */
  .sidebar section,
  .sidebar .edu-list li {
    page-break-inside: avoid;
    break-inside: avoid;
  }

  .photo {
    width: 100%;
    height: 48mm;
    object-fit: cover;
    display: block;
    filter: grayscale(100%) contrast(108%);
  }

  /* Shown only when no photo has been uploaded, so the layout never
     collapses into an empty gap. */
  .photo-empty {
    width: 100%;
    height: 48mm;
    background: #1c1c18;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22pt;
    letter-spacing: 0.12em;
    color: var(--on-dark-muted);
  }

  .sidebar-body {
    padding: 8mm 8mm 6mm;
  }

  .sidebar h2 {
    margin: 0 0 3mm;
    font-size: 10.5pt;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--on-dark);
  }

  .sidebar section + section {
    margin-top: 6.5mm;
  }

  .contact-item {
    margin-bottom: 1.8mm;
  }

  .contact-label {
    font-weight: 700;
    font-size: 8.8pt;
    color: var(--on-dark);
  }

  .contact-value {
    font-size: 8.8pt;
    color: var(--on-dark-muted);
    word-break: break-word;
  }

  .skill-list,
  .edu-list {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .skill-list li {
    font-size: 9pt;
    color: var(--on-dark-muted);
    padding: 1mm 0;
    border-bottom: 0.2mm solid rgba(243, 241, 234, 0.12);
  }

  .skill-list li:last-child {
    border-bottom: 0;
  }

  .edu-list li {
    margin-bottom: 2.4mm;
  }

  .edu-title {
    font-weight: 700;
    font-size: 9pt;
    color: var(--on-dark);
  }

  .edu-meta {
    font-size: 8.6pt;
    color: var(--on-dark-muted);
  }

  /* Subject-and-grade lines under a school entry. */
  .edu-detail {
    margin: 1.2mm 0 0;
    padding: 0;
    list-style: none;
  }

  .edu-detail li {
    font-size: 8.2pt;
    line-height: 1.42;
    color: var(--on-dark-muted);
    margin-bottom: 0.4mm;
  }

  /* The tools list is denser than skills — it is a keyword list, not a
     feature list, so it reads as wrapped chips rather than ruled rows. */
  .tool-list {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 1.4mm;
  }

  .tool-list li {
    font-size: 8.2pt;
    line-height: 1.3;
    color: var(--on-dark);
    border: 0.2mm solid rgba(243, 241, 234, 0.22);
    border-radius: 6mm;
    padding: 0.9mm 2.2mm;
  }

  /* ------------------------------ main ----------------------------- */

  .main {
    flex: 1;
    min-width: 0;
    /* Trimmed from 14mm. The header block was taking a third of the page in
       whitespace alone; this buys back the space a fourth bullet needs
       without touching a single font size. */
    padding: 11mm 12mm 10mm;
  }

  .name {
    margin: 0;
    font-size: 30pt;
    line-height: 1.04;
    letter-spacing: 0.06em;
    font-weight: 300;
    text-transform: uppercase;
  }

  .name strong {
    display: block;
    font-weight: 700;
  }

  .headline {
    margin: 4mm 0 0;
    font-size: 10pt;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .rule {
    height: 0.3mm;
    background: var(--line);
    margin: 6mm 0;
  }

  .main h2 {
    margin: 0 0 3mm;
    font-size: 11pt;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }

  .main section + section {
    margin-top: 6.5mm;
  }

  .profile-text {
    margin: 0;
    color: #2b2a26;
  }

  /* Never let a single stray line be what pushes the CV onto a second sheet. */
  p,
  li {
    orphans: 2;
    widows: 2;
  }

  .job {
    margin-bottom: 4mm;
    page-break-inside: avoid;
  }

  .job-role {
    font-weight: 700;
    font-size: 10pt;
    margin: 0;
  }

  .job-meta {
    margin: 0.6mm 0 2mm;
    font-size: 8.8pt;
    color: var(--muted);
  }

  .job ul,
  .project ul {
    margin: 0;
    padding-left: 4.5mm;
  }

  .job li {
    margin-bottom: 1.4mm;
    color: #2b2a26;
  }

  .project {
    margin-bottom: 3.5mm;
    page-break-inside: avoid;
  }

  .project-name {
    font-weight: 700;
    font-size: 9.6pt;
    margin: 0;
  }

  .project-desc {
    margin: 0.8mm 0 0;
    color: #2b2a26;
  }

  .project-tech {
    margin: 0.8mm 0 0;
    font-size: 8.6pt;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="sheet">
    <aside class="sidebar">
      <!-- FIXED: your headshot, from cv_profile.photo -->
      {{photo_html}}

      <div class="sidebar-body">
        <section>
          <h2>Contact</h2>
          <!-- FIXED: phone, address, email and links -->
          {{contact_html}}
        </section>

        <section>
          <h2>Skills</h2>
          <!-- FIXED: your human skills, printed as written -->
          {{skills_html}}
        </section>

        <section>
          <h2>Tools</h2>
          <!-- TAILORED: re-ordered so the advert's own tools come first -->
          {{tools_html}}
        </section>

        <section>
          <h2>Education</h2>
          <!-- FIXED: qualifications and grades, never rewritten -->
          {{education_html}}
        </section>
      </div>
    </aside>

    <main class="main">
      <!-- FIXED: your name -->
      <h1 class="name">{{first_name}}<strong>{{last_name}}</strong></h1>

      <!-- TAILORED: matched to the advert's job title -->
      <p class="headline">{{headline}}</p>

      <div class="rule"></div>

      <section>
        <h2>Profile</h2>
        <!-- TAILORED: rewritten around the advert's keywords -->
        <p class="profile-text">{{summary}}</p>
      </section>

      <section>
        <h2>Work Experience</h2>
        <!-- TAILORED: same real jobs, bullets rewritten for this employer -->
        {{experience_html}}
      </section>

      <section>
        <h2>Featured Projects</h2>
        <!-- TAILORED: re-ordered and re-described for this role -->
        {{projects_html}}
      </section>
    </main>
  </div>
</body>
</html>
