<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<title>full_name — CV</title>
<style>
  /* ==================================================================
     Level One CV — A4, print-first.

     This file is the DEFAULT template. On first run it is copied into
     the `cv_template` collection in PocketBase, and after that the
     PocketBase copy is what gets used — edit it there.

     ------------------------------------------------------------------
     EVERY PLACEHOLDER, AND WHETHER THE AI TOUCHES IT
     ------------------------------------------------------------------

     TAILORED — rewritten for every job advert you paste in:

       headline           job title under your name
       summary            the PROFILE paragraph
       tools_html         TOOLS — a shortlist for this advert, not
                              your whole inventory
       skills_html        SKILLS — chosen from your own list, printed
                              in your own words
       experience_html    your jobs — ONE sentence each
       projects_html      the best TWO projects for this role

     FIXED — printed exactly as you typed it in PocketBase, every time:

       full_name          your full name
       first_name         first name (for the stacked heading)
       last_name          surname
       photo_html         your headshot, faded into the sidebar
       contact_html       phone, address, email
       links_section_html the whole LINKS section, heading included.
                          Disappears when you have no links.
       links_html         the link rows only, for a layout where you
                          write the heading yourself. Never both.
       education_html     schools, qualifications, grades

     ALSO AVAILABLE — not used in this layout, but they work if you
     want them:

       job_title          the advert's job title
       company            the hiring company
       email phone location

     The names above are listed WITHOUT their braces on purpose. This
     block is a CSS comment, and written as real placeholders the app
     would substitute your CV into it — harmless until a job
     description contains the two characters that end a CSS comment,
     at which point the whole design would fall over. In the markup
     further down, wrap each name in double curly braces.

     Two kinds:
       scalar         one value, e.g. full_name
       name_html      a block the app builds. Move it wherever you
                      like, but do not try to write inside it.

     A placeholder the app does not recognise is replaced with nothing,
     so a typo leaves a gap rather than printing braces on your CV.

     Colours are the Level One palette, same as the web app.
     ================================================================== */

  @page {
    size: A4;
    margin: 0;
  }

  :root {
    --ink: #111110;        /* sidebar + headings */
    --page: #faf9f6;       /* warm off-white page */
    --muted: #6b6a66;      /* secondary text */
    --line: #e8e6e0;       /* hairline rules */
    --on-dark: #f3f1ea;    /* text on the dark sidebar */
    --on-dark-muted: #a7a49b;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
  }

  /* The dark column is painted by the BODY background, not by the sidebar
     element. A body background propagates to the page box, so Chromium
     repaints it on every printed sheet — which means the dark stripe runs
     the full length of a CV however many pages it takes.

     The obvious alternative, a `position: fixed` sidebar, looks right on
     page one and then silently clips: anything past 297mm is simply cut
     off, so a long education list disappears. This way the sidebar is an
     ordinary column that grows and flows across pages. */
  body {
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 9.6pt;
    line-height: 1.5;
    background: linear-gradient(
      to right,
      var(--ink) 0 68mm,
      var(--page) 68mm 100%
    );
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .sheet {
    display: flex;
    align-items: flex-start;
    width: 210mm;
    min-height: 297mm;
  }

  /* ---------------------------- sidebar ---------------------------- */

  .sidebar {
    width: 68mm;
    flex-shrink: 0;
    /* Transparent: the dark comes from the body background above. */
    color: var(--on-dark);
  }

  /* Keep a heading and its list on the same sheet. */
  .sidebar section,
  .sidebar .edu-list li {
    page-break-inside: avoid;
    break-inside: avoid;
  }

  /* The photo sits in a frame so the fade has something to paint onto.
     Without a wrapper there is nowhere to put the gradient: an ::after on
     the <img> itself never renders, because a replaced element has no
     generated content. */
  .photo-frame {
    position: relative;
    width: 100%;
  }

  .photo {
    width: 100%;
    height: 48mm;
    object-fit: cover;
    display: block;
    filter: grayscale(100%) contrast(108%);
  }

  /* Only the bottom of the picture dissolves into the sidebar ink — 11mm of
     a 48mm photo, so roughly the lowest fifth. Deliberately shallow: any
     deeper and it starts eating the face. The first stop is TRANSPARENT
     rather than a pale colour, so there is no grey band where the fade
     begins, and the last stop is exactly --ink, the same colour the body
     gradient paints the sidebar stripe, so the two meet with no seam. */
  .photo-frame::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 11mm;
    background: linear-gradient(
      to bottom,
      rgba(17, 17, 16, 0) 0%,
      rgba(17, 17, 16, 0.55) 45%,
      rgba(17, 17, 16, 1) 100%
    );
  }

  /* Shown only when no photo has been uploaded, so the layout never
     collapses into an empty gap. */
  .photo-empty {
    width: 100%;
    height: 48mm;
    background: #1c1c18;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22pt;
    letter-spacing: 0.12em;
    color: var(--on-dark-muted);
  }

  .sidebar-body {
    padding: 8mm 8mm 6mm;
  }

  .sidebar h2 {
    margin: 0 0 3mm;
    font-size: 10.5pt;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--on-dark);
  }

  .sidebar section + section {
    margin-top: 6.5mm;
  }

  .contact-item {
    margin-bottom: 1.8mm;
  }

  .contact-label {
    font-weight: 700;
    font-size: 8.8pt;
    color: var(--on-dark);
  }

  .contact-value {
    font-size: 8.8pt;
    color: var(--on-dark-muted);
    word-break: break-word;
  }

  /* ------------------------------ links ---------------------------- */

  .link-item {
    margin-bottom: 1.8mm;
  }

  .link-label {
    font-weight: 700;
    font-size: 8.8pt;
    color: var(--on-dark);
  }

  /* A real anchor, so the address is clickable in the PDF. Underlines are
     dropped because the column is narrow and a wrapped underlined URL is
     harder to read, not easier. break-word keeps a long address inside the
     68mm column instead of pushing the sidebar wider. */
  .link-value {
    display: block;
    font-size: 8.8pt;
    color: var(--on-dark-muted);
    text-decoration: none;
    word-break: break-word;
  }

  .skill-list,
  .edu-list {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .skill-list li {
    font-size: 9pt;
    color: var(--on-dark-muted);
    padding: 1mm 0;
    border-bottom: 0.2mm solid rgba(243, 241, 234, 0.12);
  }

  .skill-list li:last-child {
    border-bottom: 0;
  }

  .edu-list li {
    margin-bottom: 2.4mm;
  }

  .edu-title {
    font-weight: 700;
    font-size: 9pt;
    color: var(--on-dark);
  }

  .edu-meta {
    font-size: 8.6pt;
    color: var(--on-dark-muted);
  }

  /* Subject-and-grade lines under a school entry. */
  .edu-detail {
    margin: 1.2mm 0 0;
    padding: 0;
    list-style: none;
  }

  .edu-detail li {
    font-size: 8.2pt;
    line-height: 1.42;
    color: var(--on-dark-muted);
    margin-bottom: 0.4mm;
  }

  /* The tools list is denser than skills — it is a keyword list, not a
     feature list, so it reads as wrapped chips rather than ruled rows. */
  .tool-list {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 1.4mm;
  }

  .tool-list li {
    font-size: 8.2pt;
    line-height: 1.3;
    color: var(--on-dark);
    border: 0.2mm solid rgba(243, 241, 234, 0.22);
    border-radius: 6mm;
    padding: 0.9mm 2.2mm;
  }

  /* ------------------------------ main ----------------------------- */

  .main {
    flex: 1;
    min-width: 0;
    /* Trimmed from 14mm. The header block was taking a third of the page in
       whitespace alone; this buys back the space a fourth bullet needs
       without touching a single font size. */
    padding: 9mm 12mm 9mm;
  }

  .name {
    margin: 0;
    font-size: 30pt;
    line-height: 1.04;
    letter-spacing: 0.06em;
    font-weight: 300;
    text-transform: uppercase;
  }

  .name strong {
    display: block;
    font-weight: 700;
  }

  .headline {
    margin: 4mm 0 0;
    font-size: 10pt;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Was 6mm each side. Whitespace, not content — the CV has to hold a
     120-word profile AND four dated roles on one sheet, and measurement said
     this rule alone was costing 15px of the budget. No font size moves. */
  .rule {
    height: 0.3mm;
    background: var(--line);
    margin: 4mm 0;
  }

  .main h2 {
    margin: 0 0 3mm;
    font-size: 11pt;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }

  .main section + section {
    margin-top: 5.5mm;
  }

  .profile-text {
    margin: 0;
    color: #2b2a26;
  }

  /* Never let a single stray line be what pushes the CV onto a second sheet. */
  p,
  li {
    orphans: 2;
    widows: 2;
  }

  .job {
    margin-bottom: 3.2mm;
    page-break-inside: avoid;
  }

  .job-role {
    font-weight: 700;
    font-size: 10pt;
    margin: 0;
  }

  .job-meta {
    margin: 0.6mm 0 2mm;
    font-size: 8.8pt;
    color: var(--muted);
  }

  /* Early roles: one line each, no bullet. They still belong on the CV — a
     gap in the dates asks more questions than a job title does — but they
     have stopped earning a paragraph. */
  .job-early {
    margin-bottom: 1.6mm;
  }

  .job-role-early {
    margin: 0;
    font-size: 9.2pt;
    font-weight: 700;
  }

  .job-meta-early {
    font-weight: 400;
    font-size: 8.8pt;
    color: var(--muted);
  }

  .job ul,
  .project ul {
    margin: 0;
    padding-left: 4.5mm;
  }

  .job li {
    margin-bottom: 1.4mm;
    color: #2b2a26;
  }

  .project {
    margin-bottom: 3.5mm;
    page-break-inside: avoid;
  }

  .project-name {
    font-weight: 700;
    font-size: 9.6pt;
    margin: 0;
  }

  .project-desc {
    margin: 0.8mm 0 0;
    color: #2b2a26;
  }

  .project-tech {
    margin: 0.8mm 0 0;
    font-size: 8.6pt;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="sheet">
    <aside class="sidebar">
      <!-- FIXED: your headshot, from cv_profile.photo. Uploaded there, not
           linked: the app inlines the file so printing needs no network. -->
      {{photo_html}}

      <div class="sidebar-body">
        <section>
          <h2>Contact</h2>
          <!-- FIXED: phone, address and email -->
          {{contact_html}}
        </section>

        <!-- FIXED: from cv_profile.links. This placeholder is the WHOLE
             section, heading included, so an empty links field prints nothing
             at all rather than a heading standing over a gap.
             If you prefer to write the heading yourself, use the links_html
             placeholder instead — that one is the rows only. Never both. -->
        {{links_section_html}}

        <section>
          <h2>Skills</h2>
          <!-- TAILORED: which skills, chosen from your list.
               The wording is always yours — see chooseSkills() in cv-html.ts. -->
          {{skills_html}}
        </section>

        <section>
          <h2>Tools</h2>
          <!-- TAILORED: a shortlist for this advert, 6-8 of your tools -->
          {{tools_html}}
        </section>

        <section>
          <h2>Education</h2>
          <!-- FIXED: qualifications and grades, never rewritten -->
          {{education_html}}
        </section>
      </div>
    </aside>

    <main class="main">
      <!-- FIXED: your name -->
      <h1 class="name">{{first_name}}<strong>{{last_name}}</strong></h1>

      <!-- TAILORED: matched to the advert's job title -->
      <p class="headline">{{headline}}</p>

      <div class="rule"></div>

      <section>
        <h2>Profile</h2>
        <!-- TAILORED: rewritten around the advert's keywords -->
        <p class="profile-text">{{summary}}</p>
      </section>

      <section>
        <h2>Work Experience</h2>
        <!-- TAILORED: same real jobs, ONE sentence each -->
        {{experience_html}}
      </section>

      <section>
        <h2>Featured Projects</h2>
        <!-- TAILORED: the best TWO for this role, re-described -->
        {{projects_html}}
      </section>
    </main>
  </div>
</body>
</html>
